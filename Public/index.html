<title>CerdasIn</title>
<style>
:root{--blue:#2563eb;--ink:#17202a;--muted:#667085;--line:#dfe4ea;--bg:#f6f8fb;--green:#16864b;--red:#d83a45;--gold:#b77900}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:8px 14px 40px}.nav{height:42px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:7px;z-index:10}.brand{font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}
.hero{text-align:center;padding:28px 4px 18px}.hero h1{font-size:42px;margin:0 0 5px;letter-spacing:-1px}.hero p{margin:5px}
.grid{display:grid;gap:9px}.menu,.card{background:#fff;border:1px solid var(--line);border-radius:12px}.menu{width:100%;padding:12px;text-align:left;display:flex;align-items:center;gap:10px}.menu .ico{font-size:22px;width:34px}.menu b{font-size:16px}
.card{padding:13px;margin:9px 0}.title{display:flex;align-items:center;justify-content:space-between;gap:8px}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}
label{display:block;font-size:12px;font-weight:700;margin:9px 0 3px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #d5dce3;border-radius:9px;padding:10px;background:#fff}
button{cursor:pointer}.btn{border:1px solid #d5dce3;background:#fff;border-radius:9px;padding:9px 12px}.primary{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:11px 14px;font-weight:700;width:100%}
.q{font-size:19px;line-height:1.48;margin:10px 0 12px}.progress{height:6px;background:#e8ecf0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}
.answer{display:block;width:100%;text-align:left;border:1px solid #d5dce3;background:#fff;border-radius:9px;padding:11px;margin:6px 0}.answer.correct{background:#edfff4;border-color:var(--green)}.answer.wrong{background:#fff0f1;border-color:var(--red)}
.feedback{padding:11px;border-radius:9px;background:#f7f9fb;margin-top:9px}.hint{background:#fff9df;border:1px solid #ead99a;padding:9px;border-radius:9px;margin:8px 0}.pill{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 8px;font-size:12px}
.hide{display:none!important}.score{font-size:38px;font-weight:800}.danger{color:var(--red)}.ok{color:var(--green)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px 6px;border-bottom:1px solid #edf0f3;text-align:left;font-size:12px;vertical-align:top}.table-wrap{overflow:auto}.notice{padding:10px;border-radius:9px;background:#eef5ff}.chat{min-height:160px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}.bubble{padding:9px 11px;border-radius:11px;background:#edf1f5;margin:6px 0;white-space:pre-wrap}.bubble.me{background:#e8f1ff;text-align:right}
@media(max-width:430px){.hero h1{font-size:36px}.q{font-size:18px}.wrap{padding-left:10px;padding-right:10px}}
</style>

function fmt(s){s=Math.max(0,Number(s)||0);return Math.floor(s/60)+' menit '+String(s%60).padStart(2,'0')+' detik'}
function beep(ok){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?880:220;o.connect(g);g.connect(c.destination);g.gain.value=.04;o.start();o.stop(c.currentTime+.12)}catch{}}
function stopTimer(){if(state.timerId){clearInterval(state.timerId);state.timerId=null}}
function subjectsFor(level){
 const set=[...new Set(BANK.filter(q=>q.level===level&&q.category==='Mapel').map(q=>q.subject))];
 return set.length?set:['Matematika'];
}
function home(){
 stopTimer();
 app.innerHTML=`<section class="hero"><h1>CerdasIn</h1><p>Simulasi dan latihan untuk menguji kemampuanmu.</p><p class="muted">Tidak harus langsung hebat. Yang penting terus mencoba, terus belajar, dan terus berkembang.</p></section>
 <div class="grid">
 <button class="menu" onclick="choose('LATIHAN')"><span class="ico">📚</span><span><b>Latihan</b><br><span class="small muted">Belajar tanpa masuk peringkat</span></span></button>
 <button class="menu" onclick="choose('KOMPETISI')"><span class="ico">🏆</span><span><b>Kompetisi</b><br><span class="small muted">Hasil dapat masuk peringkat</span></span></button>
 <button class="menu" onclick="choose('IQ')"><span class="ico">🧠</span><span><b>Tes IQ</b><br><span class="small muted">Soal logika dan penalaran</span></span></button>
 <button class="menu" onclick="duet()"><span class="ico">⚔️</span><span><b>Lawan / Duet</b><br><span class="small muted">Mapel, pilihan langsung dihitung</span></span></button>
 <button class="menu" onclick="ranking()"><span class="ico">🏅</span><span><b>Peringkat</b><br><span class="small muted">Hasil yang tersimpan di perangkat ini</span></span></button>
 <button class="menu" onclick="ai()"><span class="ico">🤖</span><span><b>CerdasIn AI</b><br><span class="small muted">Mode demo tanpa server</span></span></button>
 </div>`;
}
function choose(mode){
 state.mode=mode;
 if(mode==='IQ'){config('Tes IQ');return}
 app.innerHTML=`<button class="btn" onclick="home()">← Beranda</button><div class="card"><h2>${mode==='LATIHAN'?'📚 Latihan':'🏆 Kompetisi'}</h2>
 <label>Jenis</label><select id="cat"><option value="Mapel">Mata Pelajaran</option><option value="TKA">TKA (bank dasar)</option><option value="Kuis">Kuis (bank mapel)</option></select>
 <label>Jenjang</label><select id="lev">${levels.map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Mata Pelajaran</label><select id="sub"></select>
 <label>Kesulitan</label><select id="dif">${diffs.map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Nama ${mode==='KOMPETISI'?'(wajib untuk hasil)':''}</label><input id="name" placeholder="Nama">
 ${mode==='KOMPETISI'?'<div class="row"><div><label>Umur</label><input id="age" type="number" min="1" max="120" placeholder="Umur"></div><div><label>Email Google</label><input id="email" type="email" placeholder="ra***@gmail.com"></div></div>':''}
 <label>Pengaturan</label><div class="row"><select id="timer"><option value="0">Timer nonaktif</option><option value="1">Timer aktif</option></select><select id="lives"><option value="0">Nyawa nonaktif</option><option value="1">Nyawa aktif</option></select></div>
 <button class="primary" style="margin-top:12px" onclick="startQuiz()">Mulai</button></div>`;
 const lev=document.getElementById('lev');const sub=document.getElementById('sub');
 function refresh(){sub.innerHTML=subjectsFor(lev.value).map(x=>`<option>${esc(x)}</option>`).join('')}
 lev.addEventListener('change',refresh);refresh();
}
function config(title){
 app.innerHTML=`<button class="btn" onclick="home()">← Beranda</button><div class="card"><h2>🧠 ${title}</h2>
 <label>Jenjang</label><select id="lev">${levels.map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Kesulitan</label><select id="dif">${diffs.map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Timer</label><select id="timer"><option value="0">Nonaktif</option><option value="1">Aktif</option></select>
 <label>Nyawa</label><select id="lives"><option value="0">Nonaktif</option><option value="1">Aktif</option></select>
 <label>Nama</label><input id="name" placeholder="Nama">
 <button class="primary" style="margin-top:12px" onclick="startQuiz()">Mulai Tes IQ</button></div>`;
}
function startQuiz(){
 state.level=document.getElementById('lev').value;state.difficulty=document.getElementById('dif').value;
 state.timer=document.getElementById('timer').value==='1';state.lives=document.getElementById('lives').value==='1'||['Sulit','Sangat Sulit'].includes(state.difficulty);state.left=5;
 state.student={name:document.getElementById('name')?.value||'Peserta',age:document.getElementById('age')?.value||'',email:document.getElementById('email')?.value||''};
 if(state.mode==='IQ'){state.category='Tes IQ';state.subject='Logika';}
 else {state.category=document.getElementById('cat').value;state.subject=document.getElementById('sub').value;}
 let arr=BANK.filter(q=>q.level===state.level&&q.difficulty===state.difficulty&&((state.mode==='IQ'&&q.category==='Tes IQ')||(state.mode!=='IQ'&&q.category==='Mapel'&&q.subject===state.subject)));
 if(!arr.length && state.mode!=='IQ') arr=BANK.filter(q=>q.level===state.level&&q.difficulty===state.difficulty&&q.category==='Mapel');
 arr=arr.sort(()=>Math.random()-.5);state.questions=arr.slice(0,Math.min(20,arr.length));
 if(!state.questions.length)return alert('Belum ada soal untuk pilihan ini. Coba kesulitan lain.');
 state.index=0;state.score=0;state.wrong=0;state.answers=[];state.started=Date.now();state.seconds=0;renderQuestion();
 if(state.timer)state.timerId=setInterval(()=>{state.seconds=Math.floor((Date.now()-state.started)/1000);const e=document.getElementById('clock');if(e)e.textContent=fmt(state.seconds)},1000);
}
function renderQuestion(){
 const q=state.questions[state.index];
 const hintAllowed=['Mudah','Sedang'].includes(state.difficulty)&&state.mode!=='KOMPETISI';
 app.innerHTML=`<div class="title"><button class="btn" onclick="confirmExit()">←</button><span class="pill">${state.index+1}/${state.questions.length}</span><span class="pill">⭐ ${state.score}</span>${state.lives?`<span class="pill">❤️ ${state.left}</span>`:''}${state.timer?`<span class="pill" id="clock">${fmt(state.seconds)}</span>`:''}</div>
 <div class="progress"><i style="width:${state.index/state.questions.length*100}%"></i></div>
 <div class="card"><div class="small muted">${esc(state.level)} • ${esc(state.subject)} • ${esc(state.difficulty)}</div><div class="q">${esc(q.question)}</div>
 ${hintAllowed?`<button class="btn" onclick="document.getElementById('hintbox').classList.toggle('hide')">💡 Petunjuk</button><div id="hintbox" class="hint hide">${esc(q.hint||'Gunakan informasi penting pada soal dan bandingkan semua pilihan.')}</div>`:''}
 <div id="answers">${q.options.map((o,i)=>`<button class="answer" data-i="${i}" onclick="answer(${i})">${esc(o)}</button>`).join('')}</div>
 <div id="feedback" class="feedback hide"></div><button id="next" class="primary hide" onclick="nextQuestion()">Lanjutkan</button></div>`;
}
function answer(i){
 const q=state.questions[state.index],ok=i===q.answer;
 document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
 document.querySelector(`[data-i="${i}"]`).classList.add(ok?'correct':'wrong');
 if(!ok)document.querySelector(`[data-i="${q.answer}"]`).classList.add('correct');
 if(ok){state.score+=100;beep(true)}else{state.wrong++;if(state.lives){state.left--;beep(false)}}
 state.answers.push({q,selected:i,ok});
 const f=document.getElementById('feedback');f.classList.remove('hide');
 if(state.mode==='KOMPETISI') f.innerHTML=ok?`<b class="ok">✓ Jawaban dicatat</b>`:`<b class="danger">✕ Jawaban dicatat</b>`;
 else f.innerHTML=ok?`<b class="ok">✓ Benar</b><br>${esc(q.explanation)}`:`<b class="danger">✕ Tidak benar</b><br>Jawaban benar: <b>${esc(q.options[q.answer])}</b><br>${esc(q.explanation)}`;
 document.getElementById('next').classList.remove('hide');
}
function nextQuestion(){if(state.lives&&state.left<=0)return finish();state.index++;if(state.index>=state.questions.length)finish();else renderQuestion()}
function confirmExit(){if(confirm('Keluar sekarang? Progres yang belum selesai tidak dihitung sebagai hasil.'))home()}
function getResults(){try{return JSON.parse(localStorage.getItem('cerdasin_results')||'[]')}catch{return[]}}
function saveResult(row){const a=getResults();a.push(row);localStorage.setItem('cerdasin_results',JSON.stringify(a))}
function finish(){
 stopTimer();const sec=Math.floor((Date.now()-state.started)/1000),ranked=state.mode==='KOMPETISI'||state.mode==='IQ';
 if(ranked){saveResult({name:state.student.name||'Peserta',age:Number(state.student.age)||0,email:maskEmail(state.student.email),mode:state.mode==='IQ'?'Tes IQ':'Kompetisi',subject:state.subject,level:state.level,difficulty:state.difficulty,score:state.score,correct:state.questions.length-state.wrong,wrong:state.wrong,durationSeconds:sec,finishedAt:new Date().toISOString()})}
 app.innerHTML=`<button class="btn" onclick="home()">← Beranda</button><div class="card"><div class="small muted">${ranked?'Hasil selesai':'Latihan selesai'}</div><div class="score">${state.score}</div>
 <p><b>${state.questions.length-state.wrong}</b> benar • <b>${state.wrong}</b> salah • selesai dalam ${fmt(sec)}</p>
 <p class="${ranked?'ok':'muted'}">${ranked?'✓ Hasil tersimpan di peringkat perangkat ini.':'Latihan tidak masuk peringkat.'}</p></div>
 <div class="card"><h3>Kesalahan</h3>${state.answers.filter(x=>!x.ok).length?state.answers.filter(x=>!x.ok).map((x,k)=>`<div class="card"><b>${k+1}. ${esc(x.q.question)}</b><p class="danger">Jawabanmu: ${esc(x.q.options[x.selected])}</p><p class="ok">Jawaban benar: ${esc(x.q.options[x.q.answer])}</p><p>${esc(x.q.explanation)}</p></div>`).join(''):'<p class="ok">Semua jawaban benar 🎉</p>'}</div>
 <button class="primary" onclick="shareResult(${state.score})">Bagikan simulasi ini ke temanmu</button>`;
}
function maskEmail(e){const s=String(e||'').trim().toLowerCase();if(!s)return '';const [u,d]=s.split('@');return u?(u.slice(0,2)+'***@'+(d||'')):''}
async function shareResult(score){const text=`Aku baru selesai CerdasIn dan mendapat nilai ${score}!`;if(navigator.share){try{await navigator.share({title:'CerdasIn',text})}catch{}}else alert(text)}
function ranking(){
 const a=getResults().sort((x,y)=>y.score-x.score),top=a.slice(0,10),recent=[...a].sort((x,y)=>new Date(y.finishedAt)-new Date(x.finishedAt)).filter(x=>x.score>0).slice(0,10);
 app.innerHTML=`<button class="btn" onclick="home()">← Beranda</button><div class="title"><h2>🏅 Peringkat</h2><span class="pill">Top 10</span></div>
 <div class="notice small">Peringkat ini tersimpan di browser/perangkat ini. Belum merupakan peringkat global.</div>
 <div class="card"><h3>Terbaik</h3><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Peserta</th><th>Mode</th><th>Detail</th><th>Nilai</th><th>Benar/Salah</th><th>Selesai</th></tr></thead><tbody>${top.map(row).join('')||'<tr><td colspan="7">Belum ada hasil.</td></tr>'}</tbody></table></div></div>
 <div class="card"><h3>Terbaru</h3><div class="table-wrap"><table class="table"><tbody>${recent.map(row).join('')||'<tr><td colspan="7">Belum ada data.</td></tr>'}</tbody></table></div></div>`;
}
function row(x,i){return `<tr><td>${i+1}</td><td><b>${esc(x.name)}</b><br>${x.age||'-'} th<br>${esc(x.email||'-')}</td><td>${esc(x.mode)}</td><td>${esc(x.level)}<br>${esc(x.subject)}<br>${esc(x.difficulty)}</td><td><b>${x.score}</b></td><td>${x.correct}/${x.wrong}</td><td>${fmt(x.durationSeconds)}<br>${new Date(x.finishedAt).toLocaleString('id-ID')}</td></tr>`}
function duet(){
 app.innerHTML=`<button class="btn" onclick="home()">← Kembali</button><div class="card"><h2>⚔️ Lawan / Duet</h2><p class="muted">Mapel saja • tanpa petunjuk • pilihan langsung dihitung.</p>
 <label>Jenjang</label><select id="dl">${levels.map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Mata Pelajaran</label><select id="ds"></select>
 <label>Kesulitan</label><select id="dd">${diffs.map(x=>`<option>${x}</option>`).join('')}</select>
 <button class="primary" onclick="duetStart()">Mulai Duet Lokal</button></div>`;
 const dl=document.getElementById('dl'),ds=document.getElementById('ds');function r(){ds.innerHTML=subjectsFor(dl.value).map(x=>`<option>${esc(x)}</option>`).join('')}dl.addEventListener('change',r);r();
}
function duetStart(){
 state.mode='DUET';state.level=dl.value;state.subject=ds.value;state.difficulty=dd.value;state.lives=true;state.left=5;state.hint=false;state.timer=false;
 state.questions=BANK.filter(q=>q.level===state.level&&q.subject===state.subject&&q.difficulty===state.difficulty&&q.category==='Mapel').sort(()=>Math.random()-.5).slice(0,10);
 if(!state.questions.length)return alert('Belum ada soal untuk pilihan ini.');state.index=0;state.score=0;state.wrong=0;state.answers=[];state.started=Date.now();renderDuet();
}
function renderDuet(){
 const q=state.questions[state.index];app.innerHTML=`<button class="btn" onclick="home()">← Keluar</button><div class="title"><span class="pill">${state.index+1}/${state.questions.length}</span><span class="pill">❤️ ${state.left}</span><span class="pill">⭐ ${state.score}</span></div>
 <div class="card"><div class="small muted">${esc(state.level)} • ${esc(state.subject)} • ${esc(state.difficulty)}</div><div class="q">${esc(q.question)}</div>${q.options.map((o,i)=>`<button class="answer" onclick="duetAnswer(${i})">${esc(o)}</button>`).join('')}</div>`;
}
function duetAnswer(i){
 const q=state.questions[state.index],ok=i===q.answer;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
 document.querySelectorAll('.answer')[i].classList.add(ok?'correct':'wrong');if(ok)state.score+=10+(state.index*10);else state.left--;beep(ok);
 setTimeout(()=>{if(state.left<=0||state.index+1>=state.questions.length){alert(ok?'Benar! Menang ronde!':'Nyawa habis / ronde selesai.');home()}else{state.index++;renderDuet()}},350);
}
function ai(){
 app.innerHTML=`<button class="btn" onclick="home()">← Kembali</button><div class="card"><h2>🤖 CerdasIn AI</h2><div id="chat" class="chat"><div class="bubble">Hai! Aku CerdasIn AI 😊 Untuk versi file ini, AI berjalan sebagai demo lokal.</div></div>
 <form onsubmit="sendAI(event)" class="row" style="margin-top:8px"><input id="aiq" placeholder="Contoh: apa itu fotosintesis?"><button class="btn">Kirim</button></form></div>`;
}
function sendAI(e){e.preventDefault();const x=document.getElementById('aiq'),q=x.value.trim();if(!q)return;const c=document.getElementById('chat');c.innerHTML+=`<div class="bubble me">${esc(q)}</div>`;let ans='CerdasIn AI versi file ini masih demo lokal. Untuk jawaban AI sungguhan, backend AI perlu diaktifkan di server.';if(/fotosintesis/i.test(q))ans='Fotosintesis adalah proses tumbuhan membuat makanan dengan memanfaatkan cahaya, air, dan karbon dioksida.';if(/pythagoras/i.test(q))ans='Teorema Pythagoras menghubungkan sisi-sisi segitiga siku-siku: kuadrat sisi miring sama dengan jumlah kuadrat dua sisi lainnya.';c.innerHTML+=`<div class="bubble">${ans}</div>`;x.value='';c.scrollTop=c.scrollHeight}
window.home=home;window.choose=choose;window.config=config;window.startQuiz=startQuiz;window.answer=answer;window.nextQuestion=nextQuestion;window.confirmExit=confirmExit;window.shareResult=shareResult;window.ranking=ranking;window.duet=duet;window.duetStart=duetStart;window.duetAnswer=duetAnswer;window.ai=ai;window.sendAI=sendAI;
home();
</script>
</body>
</html>
